[project]
name = "columbia-hackathon"
version = "0.1.0"
description = "Document extraction, validation, and line-item review services"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "google-auth>=2.29.0",
  "requests>=2.31.0",
  "pdfplumber>=0.11.0",
  "openpyxl>=3.1.0",
  "Pillow>=10.0.0",
  "pytesseract>=0.3.10",
  "openai>=1.60.0",
  "psycopg[binary,pool]>=3.2.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
